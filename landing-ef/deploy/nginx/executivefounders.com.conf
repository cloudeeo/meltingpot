# executivefounders.com — static landing
#
# Replaces the previous proxy-to-:3001 vhost (which served the full
# Astro/Node site). The full site has been moved to a separate domain;
# this host now serves the lightweight summary landing produced by
# ../landing-ef/.
#
# Document root: /var/www/ef-landing (populated by deploy.sh).

server {
    listen 80;
    listen [::]:80;
    server_name executivefounders.com www.executivefounders.com;
    return 301 https://executivefounders.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.executivefounders.com;

    ssl_certificate /etc/letsencrypt/live/executivefounders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/executivefounders.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://executivefounders.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name executivefounders.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/executivefounders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/executivefounders.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/ef-landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Hashed Astro assets — fingerprinted, safe to cache for a year.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static brand assets in the project's public/ tree — long but not
    # immutable cache (filename is stable across deploys).
    location ~* \.(webp|png|svg|ico|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Single-page landing — fall back to index.html for everything else
    # so deep URLs and trailing slashes do not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
